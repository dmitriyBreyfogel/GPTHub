[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workspace-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "redis[hiredis]>=5.0,<6.0",
    "celery[redis,amqp]>=5.3,<6.0",
    "flower>=2.0,<3.0",
    "miniopy-async>=1.20,<2.0",
    "mem0ai>=0.1,<1.0",
    "qdrant-client>=1.9,<2.0",
    "tenacity>=8.2,<10.0",
    "pypdf>=4.0,<6.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "beautifulsoup4>=4.12,<5.0",
    "duckduckgo-search>=6.0,<8.0",
    "python-pptx>=1.0,<2.0",
    "langgraph>=0.2,<1.0",
    "langchain-openai>=0.2,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "langfuse>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
