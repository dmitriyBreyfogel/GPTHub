name: ${COMPOSE_PROJECT_NAME}

services:
  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  backend:
    build:
      context: ./backend
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_RELOAD: ${BACKEND_RELOAD}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      MWS_GPT_BASE_URL: ${MWS_GPT_BASE_URL}
      MWS_GPT_API_KEY: ${MWS_GPT_API_KEY}
      DEFAULT_TEXT_MODEL: ${DEFAULT_TEXT_MODEL}
      FALLBACK_TEXT_MODEL: ${FALLBACK_TEXT_MODEL}
      VISION_MODEL: ${VISION_MODEL}
      VISION_FALLBACK_MODEL: ${VISION_FALLBACK_MODEL}
      ASR_MODEL: ${ASR_MODEL}
      IMAGE_GENERATION_MODEL: ${IMAGE_GENERATION_MODEL}
      IMAGE_GENERATION_FALLBACK_MODEL: ${IMAGE_GENERATION_FALLBACK_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      QDRANT_URL: ${QDRANT_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      POSTGRES_DSN: ${POSTGRES_DSN}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - app

  worker-high:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q high -c 4 -l info
    environment:
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      MWS_GPT_BASE_URL: ${MWS_GPT_BASE_URL}
      MWS_GPT_API_KEY: ${MWS_GPT_API_KEY}
      ASR_MODEL: ${ASR_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      POSTGRES_DSN: ${POSTGRES_DSN}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - app

  worker-low:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q low -c 2 -l info
    environment:
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      MWS_GPT_BASE_URL: ${MWS_GPT_BASE_URL}
      MWS_GPT_API_KEY: ${MWS_GPT_API_KEY}
      DEFAULT_TEXT_MODEL: ${DEFAULT_TEXT_MODEL}
      IMAGE_GENERATION_MODEL: ${IMAGE_GENERATION_MODEL}
      IMAGE_GENERATION_FALLBACK_MODEL: ${IMAGE_GENERATION_FALLBACK_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      POSTGRES_DSN: ${POSTGRES_DSN}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - app

  flower:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app.celery_app flower --port=5555
    environment:
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        OPENWEBUI_IMAGE: ${OPENWEBUI_IMAGE}
    environment:
      OPENAI_API_BASE_URL: ${OPENWEBUI_API_BASE_URL}
      OPENAI_API_KEY: ${OPENWEBUI_API_KEY}
    ports:
      - "${FRONTEND_PORT}:8080"
    volumes:
      - openwebui-data:/app/backend/data
    depends_on:
      - backend
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - app

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - app

volumes:
  openwebui-data:
  postgres-data:
  redis-data:
  rabbitmq-data:
  qdrant-data:
  minio-data:

networks:
  app:
    driver: bridge
