name: ${COMPOSE_PROJECT_NAME}

services:
  backend:
    build:
      context: ./backend
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_RELOAD: ${BACKEND_RELOAD}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MWS_GPT_BASE_URL: ${MWS_GPT_BASE_URL}
      MWS_GPT_API_KEY: ${MWS_GPT_API_KEY}
      DEFAULT_TEXT_MODEL: ${DEFAULT_TEXT_MODEL}
      FALLBACK_TEXT_MODEL: ${FALLBACK_TEXT_MODEL}
      VISION_MODEL: ${VISION_MODEL}
      VISION_FALLBACK_MODEL: ${VISION_FALLBACK_MODEL}
      ASR_MODEL: ${ASR_MODEL}
      IMAGE_GENERATION_MODEL: ${IMAGE_GENERATION_MODEL}
      IMAGE_GENERATION_FALLBACK_MODEL: ${IMAGE_GENERATION_FALLBACK_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app

  frontend:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      OPENAI_API_BASE_URL: ${OPENWEBUI_API_BASE_URL}
      OPENAI_API_KEY: ${OPENWEBUI_API_KEY}
    ports:
      - "${FRONTEND_PORT}:8080"
    volumes:
      - openwebui-data:/app/backend/data
    depends_on:
      - backend
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app

volumes:
  openwebui-data:
  postgres-data:
  redis-data:

networks:
  app:
    driver: bridge
