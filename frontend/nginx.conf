worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=30s ipv6=off;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 80;
        set $openwebui_upstream http://openwebui:8080;

        location ^~ /gpthub/ {
            alias /etc/nginx/static/;
            expires 5m;
            add_header Cache-Control "no-cache, must-revalidate";
            charset utf-8;
            charset_types text/css application/javascript;
        }

        location ~* ^/api/(chat|stream|ollama) {
            proxy_pass $openwebui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location ~* ^/(ws|socket\.io) {
            proxy_pass $openwebui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass $openwebui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept-Encoding "identity";

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 64k;

            sub_filter '</head>' '<link rel="stylesheet" href="/gpthub/custom.css?v=6"><script src="/gpthub/custom.js?v=6" defer></script></head>';
            sub_filter_once on;
            sub_filter_types text/html;
        }
    }
}
